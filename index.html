<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Arcade | Brick Breaker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header class="hud">
      <div>
        <h1>Pixel Brick Breaker</h1>
        <p class="subtitle">Move with Mouse or Left/Right Arrows</p>
      </div>
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
      </div>
    </header>
    <canvas id="gameCanvas" width="540" height="360"></canvas>
    <div class="controls">
      <button id="actionBtn">Start / Restart</button>
      <span id="statusText">Press Space or Click Start</span>
    </div>
  </main>
  <script src="script.js?v=2"></script>
</body>
</html>
