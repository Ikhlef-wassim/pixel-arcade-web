<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Arcade | Brick Breaker</title>
  <meta name="description" content="Pixel Brick Breaker: a browser arcade game with five levels, multi-hit bricks, power-ups and sound. Play with the keyboard, mouse or touch." />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main class="card">
    <header class="hud">
      <div>
        <h1>Pixel Brick Breaker</h1>
        <p class="subtitle">Arrow keys, mouse or touch &bull; P to pause</p>
      </div>
      <div class="stats">
        <span>Level: <strong id="level">1</strong></span>
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
      </div>
    </header>
    <canvas id="gameCanvas" width="540" height="360"></canvas>
    <div class="controls">
      <div class="buttons">
        <button id="actionBtn">Start / Restart</button>
        <button id="muteBtn" class="secondary">Sound: On</button>
      </div>
      <span id="statusText">Press Space or tap to start</span>
    </div>
  </main>
  <script src="script.js?v=5"></script>
</body>
</html>
